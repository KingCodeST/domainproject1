version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: student-shuttles-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_in_env}
      MYSQL_DATABASE: ${DB_NAME:-student_shuttles_db}
      MYSQL_USER: ${DB_USER:-shuttles_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
    ports:
      - "3306:3306"
    networks:
      - shuttle-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
      interval: 10s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Spring Boot Application Service
  app:
    image: student-shuttles:latest
    container_name: student-shuttles-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${DB_NAME:-student_shuttles_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-shuttles_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
    networks:
      - shuttle-network
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      timeout: 10s
      retries: 5
      interval: 30s

networks:
  shuttle-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
