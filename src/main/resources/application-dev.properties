# Development Configuration for Student Shuttles Application
spring.application.name=StudentShuttles

# Database Configuration (Development - H2)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Alternative: Use MySQL locally
# spring.datasource.url=jdbc:mysql://localhost:3306/student_shuttles_db
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# Logging Configuration (Development)
logging.level.root=INFO
logging.level.za.ac.cputassignment=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# DevTools
spring.devtools.restart.enabled=true

# Actuator (Development)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
